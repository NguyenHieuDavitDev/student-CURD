# SQL Server + Spring Boot + Nginx
#
#   cp .env.example .env   # chỉnh MSSQL_SA_PASSWORD
#   docker compose up -d sqlserver
#   # tạo DB QLSV (xem README), rồi:
#   docker compose up -d --build
#
# Biến tuỳ chọn trong .env:
#   NGINX_HTTP_PORT=8088   # nếu cổng 80 bận → http://localhost:8088/

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Đặt MSSQL_SA_PASSWORD trong file .env}
    ports:
      - "${SQLSERVER_HOST_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 35s

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=QLSV;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
      APP_UPLOAD_BASE_DIR: /data/uploads
    volumes:
      - app-uploads:/data/uploads
    expose:
      - "8080"
    restart: on-failure
    depends_on:
      sqlserver:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  sqlserver-data:
  app-uploads:
