# Profile "docker": Compose (Nginx + app + SQL Server).
spring.application.name=demo
server.port=8080
server.forward-headers-strategy=framework

spring.thymeleaf.prefix=classpath:/
spring.thymeleaf.suffix=.html

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=120000

spring.jpa.hibernate.ddl-auto=update

app.upload.base-dir=${APP_UPLOAD_BASE_DIR:/data/uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Actuator: chỉ health (phục vụ Docker healthcheck). Không bật chi tiết ra ngoài.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
# Readiness chỉ UP khi DB sẵn sàng (phù hợp depends_on của Nginx).
management.endpoint.health.group.readiness.include=readinessState,db
